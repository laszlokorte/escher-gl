<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Escher</title>
        <link rel="icon" href="favicon.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <style>
            * {
                box-sizing: border-box;
            }
            :root,
            html,
            body {
                height: 100%;
                background-color: #594732;
                font-family: monospace;
            }

            body {
                display: grid;
                margin: 0;
                padding: 0;
                justify-content: stretch;
                align-content: stretch;
                grid-template-columns: 100%;
                grid-template-rows: 100%;
            }
            .layer {
                align-self: stretch;
                justify-self: stretch;
                width: 100%;
                height: 100%;
                display: block;
                grid-area: 1 / 1 / -1 / -1;
                margin: 0;
                padding: 0;
                touch-action: none;
            }
            .layer.top {
                align-self: start;
                height: auto;
                padding: 2em;
                touch-action: none;
            }

            .control {
                cursor: move;
            }

            .active circle {
                stroke: aquamarine;
                opacity: 1;
                fill-opacity: 0.5;
            }

            .active polygon {
                fill: aquamarine;
                fill-opacity: 0.5;
            }
            .active rect {
                opacity: 1;
                fill-opacity: 0.7;
            }
            #debug {
                display: none;
            }
            circle {
                opacity: 0.2;
                stroke: white;
                stroke-width: 1;
            }
            polygon {
                fill-opacity: 0.8;
                fill: #ddd;
            }
            .dragger[mode="-escher"],
            .dragger[mode="-warped"] {
                display: none;
            }
            rect {
                opacity: 0.2;
                fill: black;
            }
            pre {
                pointer-events: none;
            }
            legend {
                background-color: #300d48;
                color: #fff;
                padding: 0.5ex 1ex;
            }
            fieldset {
                border: none;
                background-color: #fffc;
                border: 2px solid #300d48;
            }
            label {
                display: flex;
                gap: 1ex;
                align-items: center;
                background-color: #fffa;
                width: max-content;
                padding: 1ex;
                user-select: none;
            }
            .ctrls {
                display: flex;
                flex-wrap: wrap;
                gap: 1em;
                accent-color: #e03031;
            }

            label:has(> :checked) {
                background-color: #e03031;
                accent-color: #000;
                color: #fff;
            }
            label:has(> [type="range"]) {
                flex-grow: 1;
            }
            output {
                display: block;
                width: 5em;
            }

            .radiolist {
                display: contents;
            }
            svg {
                z-index: 10;
            }
            canvas {
                z-index: 5;
            }

            .top {
                z-index: 20;
            }
            .touch-area {
                fill: none;
                stroke: none;
                stroke-width: 0;
                pointer-events: all;
            }
        </style>
    </head>
    <body>
        <canvas id="cnv" class="layer"></canvas>
        <svg id="vg" class="layer" viewBox="-100 -100 200 200">
            <g id="ctrl" class="dragger">
                <circle r="25" cx="0" cy="0" class="touch-area"></circle>
                <circle r="10" cx="0" cy="0" class="control"></circle>

                <polygon points="-2 -4 2 -4 0 -6" fill="white" />
                <polygon points="-2 4 2 4 0 6" fill="white" />
                <polygon points="4 -2 4 2 6 0" fill="white" />
                <polygon points="-4 -2 -4 2 -6 0" fill="white" />
            </g>
            <g id="scroller">
                <rect x="-100" y="-100" width="20" height="200"></rect>
                <polygon points="-95 20 -85 20 -90 25" fill="white" />
                <polygon points="-95 -20 -85 -20 -90 -25" fill="white" />
            </g>
        </svg>
        <div class="layer top">
            <fieldset>
                <legend>Options</legend>
                <div class="ctrls">
                    <form id="showoptions" class="radiolist">
                        <label>
                            <input
                                type="radio"
                                checked
                                value="orig"
                                name="show"
                            />
                            Droste Zoom
                        </label>
                        <label>
                            <input type="radio" value="warped" name="show" />
                            Warped Zoom
                        </label>
                        <label>
                            <input type="radio" value="log" name="show" />
                            Log Map
                        </label>
                        <label>
                            <input type="radio" value="escher" name="show" />
                            Escher Zoom
                        </label>
                        <label>
                            <input type="radio" value="free" name="show" />
                            FreeStyle
                        </label>
                    </form>
                    <label>
                        Rotation
                        <input
                            type="range"
                            id="logrotation"
                            min="-3.2"
                            max="3.2"
                            style="flex-grow: 1; width: 100%"
                            step="0.01"
                            value="0.0"
                            oninput="this.nextElementSibling.value = this.value"
                        />
                        <output
                            ondblclick="
                                this.previousElementSibling.value = 0.0;
                                this.value = 0.0;
                            "
                            >0.0</output
                        >
                    </label>
                </div>
            </fieldset>
            <pre id="debug" class="layer"></pre>
        </div>
        <script src="regl.js"></script>

        <script type="module">
            function loadImage(url, w, h) {
                return new Promise((res, fail) => {
                    const texture = document.createElement("img");
                    texture.width = w;
                    texture.height = h;
                    texture.addEventListener("load", () => {
                        res(texture);
                    });
                    texture.addEventListener("error", (error) => {
                        fail(error);
                    });
                    texture.src = url;
                });
            }

            const ctrl = { x: 0, y: 0 };
            let show = "orig";
            let zoom = 0;
            let zoomCyclic = 0;
            let zoomClamped = 0;

            window.ctrl.ownerSVGElement.addEventListener("wheel", (evt) => {
                const delta = evt.deltaY / 1400;
                zoom += delta;
                zoomCyclic = ((((zoom + 2) % 4) + 4) % 4) - 2;
                zoomClamped = Math.max(0, Math.min(2, zoomClamped + delta));
                window.debug.textContent = Math.round(zoom * 100) / 100;
            });

            let offset = {
                x: 0,
                y: 0,
            };
            window.ctrl.addEventListener("pointerdown", (evt) => {
                if (!evt.isPrimary) {
                    return;
                }
                evt.preventDefault();
                evt.currentTarget.setPointerCapture(evt.pointerId);

                const bb = evt.currentTarget.getBoundingClientRect();
                offset.x = evt.clientX - bb.left - bb.width / 2;
                offset.y = evt.clientY - bb.top - bb.height / 2;

                evt.currentTarget.classList.add("active");
            });

            window.ctrl.addEventListener("pointermove", (evt) => {
                evt.preventDefault();
                if (evt.currentTarget.hasPointerCapture(evt.pointerId)) {
                    const owner = evt.currentTarget.ownerSVGElement;
                    const pt = owner.createSVGPoint();
                    pt.x = evt.clientX - offset.x;
                    pt.y = evt.clientY - offset.y;

                    var svgPos = pt.matrixTransform(
                        owner.getScreenCTM().inverse(),
                    );
                    svgPos.x = Math.max(-100, Math.min(svgPos.x, 100));
                    svgPos.y = Math.max(-100, Math.min(svgPos.y, 100));

                    ctrl.x = svgPos.x / 100;
                    ctrl.y = svgPos.y / 100;
                    evt.currentTarget.setAttribute(
                        "transform",
                        `translate(${svgPos.x}, ${svgPos.y})`,
                    );
                }
            });

            window.ctrl.addEventListener("gotpointercapture", (evt) => {
                evt.preventDefault();
                evt.currentTarget.classList.add("active");
            });

            window.ctrl.addEventListener("pointercancel", (evt) => {
                evt.currentTarget.classList.remove("active");
            });

            window.ctrl.addEventListener("lostpointercapture", (evt) => {
                evt.currentTarget.classList.remove("active");
            });
            {
                let offset = {
                    x: 0,
                    y: 0,
                };

                let prev = 0;
                window.scroller.addEventListener("pointerdown", (evt) => {
                    if (!evt.isPrimary) {
                        return;
                    }
                    evt.preventDefault();
                    evt.currentTarget.setPointerCapture(evt.pointerId);

                    const owner = evt.currentTarget.ownerSVGElement;
                    const bb = evt.currentTarget.getBoundingClientRect();
                    offset.x = evt.clientX - bb.left - bb.width / 2;
                    offset.y = evt.clientY - bb.top - bb.height / 2;

                    const pt = owner.createSVGPoint();
                    pt.x = evt.clientX;
                    pt.y = evt.clientY;

                    var svgPos = pt.matrixTransform(
                        owner.getScreenCTM().inverse(),
                    );
                    svgPos.y = Math.max(-100, Math.min(svgPos.y, 100));
                    prev = svgPos.y;

                    evt.currentTarget.classList.add("active");
                });

                window.scroller.addEventListener("pointermove", (evt) => {
                    evt.preventDefault();
                    if (evt.currentTarget.hasPointerCapture(evt.pointerId)) {
                        const owner = evt.currentTarget.ownerSVGElement;
                        const pt = owner.createSVGPoint();
                        pt.x = evt.clientX;
                        pt.y = evt.clientY;

                        var svgPos = pt.matrixTransform(
                            owner.getScreenCTM().inverse(),
                        );
                        svgPos.y = Math.max(-100, Math.min(svgPos.y, 100));

                        console.log(prev);
                        const delta = (svgPos.y - prev) / 32;
                        prev = svgPos.y;

                        zoom += delta;
                        zoomCyclic = ((((zoom + 2) % 4) + 4) % 4) - 2;
                        zoomClamped = Math.max(
                            0,
                            Math.min(2, zoomClamped + delta),
                        );
                        window.debug.textContent = Math.round(zoom * 100) / 100;
                    }
                });

                window.scroller.addEventListener("gotpointercapture", (evt) => {
                    evt.preventDefault();
                    evt.currentTarget.classList.add("active");
                });

                window.scroller.addEventListener(
                    "lostpointercapture",
                    (evt) => {
                        evt.currentTarget.classList.remove("active");
                    },
                );

                window.scroller.addEventListener("dblclick", (evt) => {
                    zoom = 0;
                    zoomCyclic = ((((zoom + 2) % 4) + 4) % 4) - 2;
                    zoomClamped = Math.max(0, Math.min(2, zoom));
                });
            }

            window.showoptions.addEventListener("input", (evt) => {
                evt.preventDefault();
                show = Object.fromEntries(new FormData(evt.currentTarget)).show;
                window.ctrl.setAttribute("mode", show);
            });

            window.ctrl.addEventListener("dblclick", (evt) => {
                ctrl.x = 0;
                ctrl.y = 0;
                evt.currentTarget.removeAttribute("transform");
            });

            const canvas = window.cnv;

            const textureImage = await loadImage(
                "escher.svg",
                2 * 2048,
                2 * 2048,
            );
            const regl = createREGL({
                canvas: cnv,
                pixelRatio: window.devicePixelRatio,
                attributes: {
                    antialias: true,
                    depth: false,
                },
            });

            const texture = regl.texture({
                data: textureImage,
                mipmap: "nice",
                mag: "linear",
                min: "linear",
                wrap: ["repeat", "repeat"],
            });
            const origPlot = regl({
                viewport: {
                    x: () =>
                        ((window.innerWidth -
                            Math.min(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    y: () =>
                        ((window.innerHeight -
                            Math.min(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    width: () =>
                        Math.min(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                    height: () =>
                        Math.min(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                },
                frag: `

                          precision mediump float;
                          uniform sampler2D texture;
                          uniform float zoomFactor;
                          uniform vec2 zoomCenter;
                          varying vec2 uv;
                          varying vec2 uvShifted;
                          void main () {
                            vec2 uvv = uvShifted;

                            if(abs(uvv.x - 0.5)*2.0 < 1.0/zoomFactor/zoomFactor  && abs(uvv.y - 0.5)*2.0 < 1.0/zoomFactor/zoomFactor ) {
                              uvv = (uvv - 0.5) * zoomFactor * zoomFactor + 0.5;
                            } else if(abs(uvv.x - 0.5)*2.0 < 1.0/zoomFactor  && abs(uvv.y - 0.5)*2.0 < 1.0/zoomFactor ) {
                              uvv = (uvv - 0.5) * zoomFactor + 0.5;
                            } else if (abs(uvv.x - 0.5) > 0.5  || abs(uvv.y - 0.5) > 0.5 ) {
                              uvv = (uvv - 0.5) / zoomFactor + 0.5;
                            }
                            uvv = uvv + zoomCenter;

                            vec4 sharp = texture2D(texture, uvv);

                            gl_FragColor = sharp;
                          }`,

                vert: `
                          precision mediump float;
                          attribute vec2 position;
                          uniform vec2 ctrl;
                          uniform float zoomCyclic;
                          uniform float sheer;
                          uniform float rotation;
                          varying vec2 uv;
                          varying vec2 uvShifted;
                          void main () {

                            vec2 cpos = (0.5 + (pow(2.0, zoomCyclic) * ((vec2(1.0-position.x, position.y + sheer * (position.x - 0.5)) - ctrl / 2.0)- 0.5))) - 0.5;

                            uvShifted = vec2(
                              cpos.x * cos(rotation) - cpos.y * sin(rotation),
                              cpos.x * sin(rotation) + cpos.y * cos(rotation)
                            ) + 0.5;
                            gl_Position = vec4(1.0 - 2.0 * position, 0, 1);
                          }`,

                attributes: {
                    position: [-2, 0, 0, -2, 2, 2],
                },

                uniforms: {
                    texture,
                    ctrl: regl.prop("ctrl"),
                    zoomCyclic: regl.prop("zoomCyclic"),
                    sheer: regl.prop("sheer"),
                    zoomClamped: regl.prop("zoomClamped"),
                    zoomFactor: regl.prop("zoomFactor"),
                    zoomCenter: regl.prop("zoomCenter"),
                    rotation: regl.prop("rotation"),
                },

                count: 3,
            });
            const logplot = regl({
                viewport: {
                    x: () =>
                        ((window.innerWidth -
                            Math.min(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    y: () =>
                        ((window.innerHeight -
                            Math.min(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    width: () =>
                        Math.min(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                    height: () =>
                        Math.min(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                },
                frag: `

              precision mediump float;
              uniform sampler2D texture;
              uniform float zoomFactor;
              uniform vec2 zoomCenter;
              varying vec2 uv;
              uniform float zoomClamped;
              uniform vec2 ctrl;
              varying vec2 uvOrig;
              uniform float rotation;
              void main () {

              vec2 cpos = vec2(1.0-uvOrig.y,uvOrig.x) - 0.5 - vec2(-ctrl.y, -ctrl.x) / 2.0;
              vec2 uvShifted = vec2(
                cpos.x * cos(rotation) - cpos.y * sin(-rotation),
                cpos.x * sin(-rotation) + cpos.y * cos(rotation)
              ) + 0.5;

                  float rad = 1.0/zoomFactor/1.0 + (1.0-1.0/zoomFactor) * mod(pow(2.0, zoomClamped) * (uvShifted.y - 0.5) + 0.5 , 1.0);

                  vec2 cc = vec2(
                    0.5 + cos(3.141 * ((uvShifted.x-0.5) * pow(2.0, zoomClamped) + 0.5) * 2.0) * rad / 2.0,
                    0.5 + sin(3.141 * ((uvShifted.x-0.5) * pow(2.0, zoomClamped) + 0.5) * 2.0) * rad / 2.0
                  );


                  vec2 uvv = cc;
                      if(abs(uvv.x - 0.5)*2.0 < 1.0/zoomFactor/zoomFactor  && abs(uvv.y - 0.5)*2.0 < 1.0/zoomFactor/zoomFactor ) {
                      uvv = (uvv - 0.5) * zoomFactor * zoomFactor + 0.5;
                    } else if(abs(uvv.x - 0.5)*2.0 < 1.0/zoomFactor  && abs(uvv.y - 0.5)*2.0 < 1.0/zoomFactor ) {
                    uvv = (uvv - 0.5) * zoomFactor + 0.5;
                  } else if (abs(uvv.x - 0.5) > 0.5  || abs(uvv.y - 0.5) > 0.5 ) {
                    uvv = (uvv - 0.5) / zoomFactor + 0.5;
                  }
                  uvv = uvv + zoomCenter;

                vec4 sharp = texture2D(texture, uvv);

                gl_FragColor = sharp;
              }`,

                vert: `
                precision highp float;
              precision mediump float;
              attribute vec2 position;
              uniform vec2 ctrl;
              uniform float zoom;
              uniform float rotation;
              varying vec2 uv;
              varying vec2 uvOrig;
              varying vec2 uvShifted;
              void main () {
                uvOrig = position;
                gl_Position = vec4(1.0 - 2.0 * position, 0, 1);
              }`,

                attributes: {
                    position: [-2, 0, 0, -2, 2, 2],
                },

                uniforms: {
                    texture,
                    ctrl: regl.prop("ctrl"),
                    zoom: regl.prop("zoom"),
                    sheer: regl.prop("sheer"),
                    rotation: regl.prop("rotation"),
                    zoomClamped: regl.prop("zoomClamped"),
                    zoomFactor: regl.prop("zoomFactor"),
                    zoomCenter: regl.prop("zoomCenter"),
                },

                count: 3,
            });
            const swirlPlot = regl({
                viewport: {
                    x: () =>
                        ((window.innerWidth -
                            Math.min(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    y: () =>
                        ((window.innerHeight -
                            Math.min(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    width: () =>
                        Math.min(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                    height: () =>
                        Math.min(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                },
                frag: `

                            precision highp float;
                          precision mediump float;
                          uniform sampler2D texture;
                          uniform float zoomFactor;
                          uniform vec2 zoomCenter;
                          uniform float zoomClamped;
                          uniform float zoom;
                          uniform float zoomCylic;
                          uniform float sheer;
                          uniform vec2 ctrl;
                          uniform vec2 offset;
                          varying vec2 uvOrig;
                          uniform float rotation;
                          uniform float escherAngle;
                          uniform float escherScale;
                          uniform float warp;
                          void main () {

                          vec2 d = (uvOrig - 0.5) + offset * 0.5;

                          vec2 polar = vec2(
                            atan(d.y, d.x) / (3.141) ,
                            log(length(d) )  / log(zoomFactor)  * warp
                          );

                            vec2 cpos = polar;
                            vec2 uvShifted = vec2(
                              cpos.x * cos(escherAngle + ctrl.x) - cpos.y * sin(escherAngle + ctrl.x ),
                              cpos.x * sin(escherAngle + ctrl.x) + cpos.y * cos(escherAngle + ctrl.x )
                              ) / 2.0  * (escherScale + ctrl.y )   + vec2(escherAngle + ctrl.x ,  escherScale + ctrl.y  ) * zoom * 0.1 + 0.5;

                            float rad = 1.0/zoomFactor/1.0 + (1.0-1.0/zoomFactor) * mod(2.0 * (uvShifted.y - 0.5) + 0.5 , 1.0);


                            //rad =  mod(uvShifted.y, 1.0);

                              vec2 cc = vec2(
                                0.5 + cos(2.0*3.141 * uvShifted.x) * rad / 2.0,
                                0.5 + sin(2.0*3.141 * uvShifted.x) * rad / 2.0
                              );


                            vec2 uvv = cc;
                              if(abs(uvv.x - 0.5)*2.0 < 1.0/zoomFactor/zoomFactor  && abs(uvv.y - 0.5)*2.0 < 1.0/zoomFactor/zoomFactor ) {
                              uvv = (uvv - 0.5) * zoomFactor * zoomFactor + 0.5;
                            } else if(abs(uvv.x - 0.5)*2.0 < 1.0/zoomFactor  && abs(uvv.y - 0.5)*2.0 < 1.0/zoomFactor ) {
                              uvv = (uvv - 0.5) * zoomFactor + 0.5;
                            } else if (abs(uvv.x - 0.5) > 0.5  || abs(uvv.y - 0.5) > 0.5 ) {
                              uvv = (uvv - 0.5) / zoomFactor + 0.5;
                            }
                            uvv = uvv + zoomCenter;

                            vec4 sharp = texture2D(texture, uvv);

                            vec2 dm = uvOrig - 0.5;
                            float r = length(dm);
                            float mask = smoothstep(0.1, 0.1, r);
                            gl_FragColor = sharp;
                          }`,

                vert: `
                          precision highp float;
                          precision mediump float;
                          attribute vec2 position;
                          uniform vec2 ctrl;
                          uniform float zoom;
                          uniform float rotation;
                          varying vec2 uvOrig;
                          void main () {
                            vec2 cp = vec2( position.x,1.0-position.y) - 0.5;
                            uvOrig = vec2(
                                cp.x * cos(rotation) - cp.y * sin(rotation),
                                cp.x * sin(rotation) + cp.y * cos(rotation)
                              ) + 0.5;
                            gl_Position = vec4(1.0 - 2.0 * position, 0, 1);
                          }`,

                attributes: {
                    position: [-2, 0, 0, -2, 2, 2],
                },

                uniforms: {
                    texture,
                    ctrl: regl.prop("ctrl"),
                    offset: regl.prop("offset"),
                    zoom: regl.prop("zoom"),
                    warp: regl.prop("warp"),
                    sheer: regl.prop("sheer"),
                    rotation: regl.prop("rotation"),
                    zoom: regl.prop("zoom"),
                    zoomCyclic: regl.prop("zoomCyclic"),
                    zoomClamped: regl.prop("zoomClamped"),
                    zoomFactor: regl.prop("zoomFactor"),
                    zoomCenter: regl.prop("zoomCenter"),
                    escherAngle: regl.prop("escherAngle"),
                    escherScale: regl.prop("escherScale"),
                },

                count: 3,
            });
            function rsz() {
                canvas.width = window.innerWidth * window.devicePixelRatio * 2;
                canvas.height =
                    window.innerHeight * window.devicePixelRatio * 2;
            }
            rsz();

            window.addEventListener("resize", rsz);

            regl.frame(({ time }) => {
                // clear contents of the drawing buffer
                regl.clear({
                    color: [0, 0, 0, 0],
                    depth: 1,
                });

                if (show === "log") {
                    logplot({
                        ctrl: [ctrl.x, ctrl.y],
                        zoom,
                        zoomClamped,
                        zoomFactor: 16,
                        sheer: 0.05,
                        zoomCenter: [0, 0],
                        rotation: logrotation.valueAsNumber,
                    });
                } else if (show == "escher") {
                    swirlPlot({
                        ctrl: [0, 0],
                        offset: [ctrl.x, ctrl.y],
                        zoom,
                        zoomClamped,
                        zoomFactor: 16,
                        sheer: 0.05,
                        zoomCenter: [0, 0],
                        rotation: logrotation.valueAsNumber,
                        escherAngle: 0.463776890039444,
                        escherScale: 1.117768667936325,
                        warp: 1,
                    });
                } else if (show == "free") {
                    swirlPlot({
                        ctrl: [ctrl.x, ctrl.y],
                        offset: [0, 0],
                        zoom,
                        zoomClamped,
                        zoomFactor: 16,
                        sheer: 0.05,
                        zoomCenter: [0, 0],
                        rotation: logrotation.valueAsNumber,
                        escherAngle: 0.0,
                        escherScale: 1.0,
                        warp: 1,
                    });
                } else if (show == "warped") {
                    swirlPlot({
                        ctrl: [0, 0],
                        offset: [ctrl.x, ctrl.y],
                        zoom,
                        zoomClamped,
                        zoomFactor: 16,
                        sheer: 0.05,
                        zoomCenter: [0, 0],
                        rotation: logrotation.valueAsNumber,
                        escherAngle: 0.0,
                        warp: 1,
                        escherScale: 1,
                    });
                } else {
                    origPlot({
                        ctrl: [ctrl.x, ctrl.y],
                        zoom,
