<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>M.C. Escher Print Gallery Shader</title>
        <link rel="icon" href="favicon.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <style>
            * {
                box-sizing: border-box;
            }
            :root,
            html,
            body {
                height: 100%;
                background-color: #594732;
                font-family: monospace;
            }

            body {
                display: grid;
                margin: 0;
                padding: 0;
                justify-content: stretch;
                align-content: stretch;
                grid-template-columns: 100%;
                grid-template-rows: 100%;
            }
            .layer {
                align-self: stretch;
                justify-self: stretch;
                width: 100%;
                height: 100%;
                display: block;
                grid-area: 1 / 1 / -1 / -1;
                margin: 0;
                padding: 0;
                touch-action: none;
            }
            .layer.top {
                align-self: start;
                height: auto;
                padding: 2em;
                touch-action: none;
            }

            .control {
                cursor: move;
            }

            .active circle {
                cursor: move;
                stroke: aquamarine;
                opacity: 1;
                fill-opacity: 0.5;
            }

            .active polygon {
                fill: aquamarine;
                fill-opacity: 0.5;
            }

            .active .rotor {
                display: none;
            }

            body:has(#gizmos:not(:checked)) .gizmo,
            body:has(.active.scroller) .dragger,
            body:has(.active.rotor) .scroller,
            body:has(.active.dragger) .scroller {
                display: none;
            }
            body:has(#gizmos:not(:checked)) .touch-area.fallback {
                display: initial;
            }
            body:has(.active) {
                cursor: none;
            }

            .rotor.active + .pan {
                display: none;
            }

            .active > path {
                cursor: move;
                stroke: aquamarine;
                opacity: 1;
                fill-opacity: 0.5;
            }
            .active rect {
                opacity: 1;
                fill-opacity: 0.7;
                stroke: none;
                stroke-width: 0;
            }
            circle {
                opacity: 0.2;
                stroke: white;
                stroke-width: 1;
            }
            polygon {
                fill-opacity: 0.8;
                fill: #ddd;
            }

            path {
                opacity: 0.2;
                stroke: white;
                stroke-width: 1;
            }
            text {
                fill: #fff;
                fill-opacity: 0.8;
                pointer-events: none;
            }
            .help {
                display: none;
            }
            .dragger[mode="-escher"],
            .dragger[mode="-warped"] {
                display: none;
            }
            rect {
                opacity: 0.2;
                fill: black;
            }
            pre {
                pointer-events: none;
            }
            legend {
                background-color: #300d48;
                color: #fff;
                padding: 0.5ex 1ex;
                user-select: none;
            }
            fieldset {
                border: none;
                background-color: #fffc;
                border: 2px solid #300d48;
                user-select: none;
            }
            label {
                display: flex;
                gap: 1ex;
                align-items: center;
                background-color: #fffa;
                width: max-content;
                padding: 1ex;
                user-select: none;
            }
            .ctrls {
                display: flex;
                flex-wrap: wrap;
                gap: 1em;
                accent-color: #e03031;
            }
            button {
                border: none;
                display: flex;
                gap: 1ex;
                align-items: center;
                background-color: #fffa;
                width: max-content;
                padding: 1ex;
                user-select: none;
            }

            button:hover,
            label:has(> input[type="radio"]:not(:checked)):hover,
            label:has(> input[type="checkbox"]:not(:checked)):hover {
                color: #a03035;
            }
            button:active {
                background-color: #e03035;
                color: #fff;
            }

            label:has(> :checked) {
                background-color: #e03031;
                accent-color: #000;
                color: #fff;
            }
            label:has(> [type="range"]) {
                flex-grow: 1;
            }
            select {
                width: 10em;
            }
            output {
                display: block;
                width: 5em;
            }

            .radiolist {
                display: contents;
            }
            svg {
                z-index: 10;
            }
            canvas {
                z-index: 5;
            }

            .top {
                z-index: 20;
            }
            .touch-area {
                fill: none;
                stroke: none;
                stroke-width: 0;
                pointer-events: all;
            }

            .touch-area.fallback {
                display: none;
            }

            .loader {
                z-index: 100;
                background-color: #594732;
                color: #fff;
                display: grid;
                place-content: center;
                font-size: 2em;
            }
            body[movie="yes"] svg {
                display: none;
            }
            body[movie="yes"] fieldset {
                display: none;
            }
        </style>
    </head>
    <body>
        <label style="display: contents" for="movie">
            <canvas id="cnv" class="layer" tabindex="-1"></canvas>
        </label>
        <svg
            id="vg"
            class="layer"
            viewbox="-100 -100 200 200"
            preserveAspectRatio="xMidYMid slice"
        >
            <g id="ctrl" class="dragger">
                <rect
                    fill="green"
                    x="-200"
                    y="-200"
                    width="400"
                    height="400"
                    class="touch-area fallback"
                ></rect>
                <circle r="30" cx="0" cy="0" class="touch-area"></circle>
                <g id="rotor" class="rotor gizmo">
                    <path
                        fill="black"
                        opacity="0.2"
                        fill-rule="evenodd"
                        d="
                        M 0,0
                        m -50,0
                        a 50,50 0 1,0 100,0
                        a 50,50 0 1,0 -100,0
                        z

                        M 0,0
                        m -40,0
                        a 40,40 0 1,0 80,0
                        a 40,40 0 1,0 -80,0
                        z
                        M 0 40 v 3
                        M 0 -40 v -7
                        M  40 0 h 3
                        M  -40 0 h -3
                      "
                    />
                </g>
                <g class="pan gizmo">
                    <circle r="10" cx="0" cy="0" class="control"></circle>

                    <polygon points="-2 -4 2 -4 0 -6" fill="white" />
                    <polygon points="-2 4 2 4 0 6" fill="white" />
                    <polygon points="4 -2 4 2 6 0" fill="white" />
                    <polygon points="-4 -2 -4 2 -6 0" fill="white" />
                    <text
                        class="help"
                        x="0"
                        y="1"
                        text-anchor="middle"
                        font-size="3"
                        fill="white"
                    >
                        Drag
                    </text>
                </g>
            </g>
        </svg>
        <svg
            id="vg"
            class="layer"
            viewbox="-100 -100 20 200"
            style="justify-self: start; width: 10vw; height: 100%"
            preserveAspectRatio="xMinYMid meet"
        >
            <g id="scroller" class="scroller gizmo">
                <rect x="-100.1" y="-100" width="20" height="200"></rect>
                <polygon points="-95 20 -85 20 -90 25" fill="white" />
                <polygon points="-95 -20 -85 -20 -90 -25" fill="white" />
                <text
                    x="-90"
                    y="0"
                    text-anchor="middle"
                    font-size="3"
                    fill="white"
                >
                    Swipe
                </text>
            </g>
        </svg>
        <div class="layer top">
            <fieldset>
                <legend>options</legend>
                <div class="ctrls">
                    <form id="showoptions" class="radiolist">
                        <div class="radiolist" id="optionlist"></div>
                        <label>
                            Image
                            <select name="image" id="textureSelect">
                                <option disabled>Choose</option>
                            </select>
                        </label>
                        <label>
                            <input
                                style="display: none"
                                type="checkbox"
                                id="movie"
                                name="movie"
                                value="yes"
                            />
                            Autoplay
                        </label>
                    </form>
                    <button id="fullscreen">Fullscreen</button>
                    <label>
                        <input
                            type="checkbox"
                            id="gizmos"
                            name="gizmos"
                            checked
                            value="yes"
                        />
                        Gizmos
                    </label>
                    <div id="errorBox"></div>
                </div>
            </fieldset>
        </div>
        <div class="layer loader" id="loader">Loading</div>
        <script src="regl.js"></script>

        <script type="module">
            function loadImage(url, w, h) {
                return new Promise((res, fail) => {
                    const texture = document.createElement("img");
                    texture.width = w;
                    texture.height = h;
                    texture.addEventListener("load", () => {
                        res(texture);
                    });
                    texture.addEventListener("error", (error) => {
                        fail(error);
                    });
                    texture.src = url;
                });
            }

            window.addEventListener("error", (evt) => {
                while (window.errorBox.firstChild) {
                    window.errorBox.removeChild(window.errorBox.firstChild);
                }
                window.errorBox.appendChild(
                    document.createTextNode(evt.message),
                );

                if (window.loader) {
                    window.loader.appendChild(
                        document.createTextNode(evt.message),
                    );
                }
            });

            const ctrl = { x: 0, y: 0 };
            let rotation = 0;
            let show = "droste";
            let zoom = 0;
            let zoomCyclic = 0;
            let zoomClamped = 0;

            window.addEventListener("keypress", (evt) => {
                if (
                    (evt.key === "Escape" && window.movie.checked) ||
                    evt.key == " "
                ) {
                    window.movie.checked = !window.movie.checked;
                    window.movie.dispatchEvent(
                        new Event("input", { bubbles: true }),
                    );
                }
            });

            function toggleFullScreen(invoker) {
                const fullscreenElement =
                    document.fullscreenElement ||
                    document.webkitFullscreenElement;

                if (!fullscreenElement) {
                    if (invoker.requestFullscreen) {
                        invoker.requestFullscreen();
                    } else if (invoker.webkitRequestFullscreen) {
                        invoker.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            }

            window.fullscreen.addEventListener("click", (evt) => {
                toggleFullScreen(document.body);
            });

            window.addEventListener("fullscreenchange", (event) => {
                if (window.movie.checked) {
                    window.movie.checked = false;
                    window.movie.dispatchEvent(
                        new Event("input", { bubbles: true }),
                    );
                }
            });

            window.movie.checked = false;

            window.ctrl.ownerSVGElement.addEventListener("wheel", (evt) => {
                evt.preventDefault();
                evt.stopPropagation();
                const delta = evt.deltaY / 1400;
                if (evt.ctrlKey || evt.metaKey) {
                    rotation += delta;
                } else {
                    zoom += delta;
                    zoomCyclic = ((((zoom + 2) % 4) + 4) % 4) - 2;
                    zoomClamped = Math.max(0, Math.min(2, zoomClamped + delta));
                }
            });
            {
                let offset = {
                    x: 0,
                    y: 0,
                };
                window.ctrl.addEventListener("pointerdown", (evt) => {
                    evt.preventDefault();
                    evt.currentTarget.setPointerCapture(evt.pointerId);

                    const bb = evt.currentTarget.getBoundingClientRect();
                    offset.x = evt.clientX - bb.left - bb.width / 2;
                    offset.y = evt.clientY - bb.top - bb.height / 2;

                    evt.currentTarget.classList.add("active");
                });

                window.ctrl.addEventListener("pointermove", (evt) => {
                    evt.preventDefault();
                    if (evt.currentTarget.hasPointerCapture(evt.pointerId)) {
                        const owner = evt.currentTarget.ownerSVGElement;
                        const pt = owner.createSVGPoint();
                        pt.x = Math.max(
                            0.1 * window.innerWidth,
                            Math.min(window.innerWidth, evt.clientX - offset.x),
                        );
                        pt.y = Math.max(
                            0,
                            Math.min(
                                window.innerHeight,
                                evt.clientY - offset.y,
                            ),
                        );

                        const svgPos = pt.matrixTransform(
                            owner.getScreenCTM().inverse(),
                        );
                        svgPos.x = Math.max(-100, Math.min(svgPos.x, 100));
                        svgPos.y = Math.max(-100, Math.min(svgPos.y, 100));

                        ctrl.x = svgPos.x / 100;
                        ctrl.y = svgPos.y / 100;
                        evt.currentTarget.setAttribute(
                            "transform",
                            `translate(${svgPos.x}, ${svgPos.y})`,
                        );
                    }
                });

                window.ctrl.addEventListener("gotpointercapture", (evt) => {
                    evt.preventDefault();
                    evt.currentTarget.classList.add("active");
                });

                window.ctrl.addEventListener("pointercancel", (evt) => {
                    evt.currentTarget.classList.remove("active");
                });

                window.ctrl.addEventListener("lostpointercapture", (evt) => {
                    evt.currentTarget.classList.remove("active");
                });
            }
            {
                let offset = {
                    x: 0,
                    y: 0,
                };

                window.scroller.ownerSVGElement.addEventListener(
                    "wheel",
                    (evt) => {
                        evt.preventDefault();
                        evt.stopPropagation();
                        const delta = evt.deltaY / 1400;

                        zoom += delta;
                        zoomCyclic = ((((zoom + 2) % 4) + 4) % 4) - 2;
                        zoomClamped = Math.max(
                            0,
                            Math.min(2, zoomClamped + delta),
                        );
                    },
                );
                let prev = 0;
                window.scroller.addEventListener("pointerdown", (evt) => {
                    evt.preventDefault();
                    evt.currentTarget.setPointerCapture(evt.pointerId);

                    const owner = evt.currentTarget.ownerSVGElement;
                    const bb = evt.currentTarget.getBoundingClientRect();
                    offset.x = evt.clientX - bb.left - bb.width / 2;
                    offset.y = evt.clientY - bb.top - bb.height / 2;

                    const pt = owner.createSVGPoint();
                    pt.x = evt.clientX;
                    pt.y = evt.clientY;

                    const svgPos = pt.matrixTransform(
                        owner.getScreenCTM().inverse(),
                    );
                    svgPos.y = Math.max(-100, Math.min(svgPos.y, 100));
                    prev = svgPos.y;

                    evt.currentTarget.classList.add("active");
                });

                window.scroller.addEventListener("pointermove", (evt) => {
                    evt.preventDefault();
                    if (evt.currentTarget.hasPointerCapture(evt.pointerId)) {
                        const owner = evt.currentTarget.ownerSVGElement;
                        const pt = owner.createSVGPoint();
                        pt.x = evt.clientX;
                        pt.y = evt.clientY;

                        const svgPos = pt.matrixTransform(
                            owner.getScreenCTM().inverse(),
                        );

                        const delta = (svgPos.y - prev) / 32;
                        prev = svgPos.y;

                        zoom += delta;
                        zoomCyclic = ((((zoom + 2) % 4) + 4) % 4) - 2;
                        zoomClamped = Math.max(
                            0,
                            Math.min(2, zoomClamped + delta),
                        );
                    }
                });

                window.scroller.addEventListener("gotpointercapture", (evt) => {
                    evt.preventDefault();
                    evt.currentTarget.classList.add("active");
                });

                window.scroller.addEventListener(
                    "lostpointercapture",
                    (evt) => {
                        evt.currentTarget.classList.remove("active");
                    },
                );

                window.scroller.addEventListener("dblclick", (evt) => {
                    zoom = 0;
                    zoomCyclic = ((((zoom + 2) % 4) + 4) % 4) - 2;
                    zoomClamped = Math.max(0, Math.min(2, zoom));
                });
            }
            {
                let prev = {
                    x: 0,
                    y: 0,
                };
                window.rotor.addEventListener("wheel", (evt) => {
                    evt.stopPropagation();
                    evt.preventDefault();
                    const delta = evt.deltaY / 1400;

                    rotation += delta;
                });

                window.rotor.addEventListener("dblclick", (evt) => {
                    evt.preventDefault();
                    evt.stopPropagation();
                    rotation = 0;

                    evt.currentTarget.removeAttribute("transform");
                });

                window.rotor.addEventListener("pointerdown", (evt) => {
                    evt.stopPropagation();
                    evt.preventDefault();
                    evt.currentTarget.setPointerCapture(evt.pointerId);

                    const owner = evt.currentTarget.ownerSVGElement;
                    const ctm = owner.getScreenCTM().inverse();

                    const pt = owner.createSVGPoint();
                    pt.x = evt.clientX;
                    pt.y = evt.clientY;

                    const ptC = owner.createSVGPoint();
                    const bb = evt.currentTarget.getBoundingClientRect();
                    ptC.x = bb.left + bb.width / 2;
                    ptC.y = bb.top + bb.height / 2;

                    const svgPos = pt.matrixTransform(ctm);
                    const svgPosCenter = ptC.matrixTransform(ctm);
                    prev.x = svgPos.x - svgPosCenter.x;
                    prev.y = svgPos.y - svgPosCenter.y;

                    evt.currentTarget.classList.add("active");
                });

                window.rotor.addEventListener("pointermove", (evt) => {
                    evt.stopPropagation();
                    evt.preventDefault();
                    if (evt.currentTarget.hasPointerCapture(evt.pointerId)) {
                        const owner = evt.currentTarget.ownerSVGElement;
                        const ctm = owner.getScreenCTM().inverse();

                        const pt = owner.createSVGPoint();
                        pt.x = evt.clientX;
                        pt.y = evt.clientY;

                        const ptC = owner.createSVGPoint();
                        const bb = evt.currentTarget.getBoundingClientRect();
                        ptC.x = bb.left + bb.width / 2;
                        ptC.y = bb.top + bb.height / 2;

                        const svgPos = pt.matrixTransform(ctm);
                        const svgPosCenter = ptC.matrixTransform(ctm);

                        svgPos.x -= svgPosCenter.x;
                        svgPos.y -= svgPosCenter.y;

                        const angle = Math.atan2(
                            svgPos.x * prev.y - svgPos.y * prev.x,
                            svgPos.x * prev.x + svgPos.y * prev.y,
                        );

                        prev.x = svgPos.x;
                        prev.y = svgPos.y;
                        rotation += angle;
                        evt.currentTarget.setAttribute(
                            "transform",
                            `rotate(${(-rotation * 180) / Math.PI})`,
                        );
                    }
                });

                window.rotor.addEventListener("gotpointercapture", (evt) => {
                    evt.stopPropagation();
                    evt.preventDefault();
                    evt.currentTarget.classList.add("active");
                });

                window.rotor.addEventListener("pointercancel", (evt) => {
                    evt.stopPropagation();
                    evt.currentTarget.classList.remove("active");
                });

                window.rotor.addEventListener("lostpointercapture", (evt) => {
                    evt.stopPropagation();
                    evt.currentTarget.classList.remove("active");
                });
            }

            const visuals = ["droste", "log", "escher", "freestyle"];

            for (const v of visuals) {
                const l = document.createElement("label");
                const i = document.createElement("input");
                i.setAttribute("type", "radio");
                i.setAttribute("name", "show");
                i.setAttribute("value", v);
                i.checked = show == v;
                l.appendChild(i);
                l.appendChild(document.createTextNode(v));
                window.optionlist.appendChild(l);
            }
            window.showoptions.addEventListener("input", (evt) => {
                evt.preventDefault();
                const formValues = Object.fromEntries(
                    new FormData(evt.currentTarget),
                );
                show = formValues.show;
                activeTexture = formValues.image;
                window.ctrl.setAttribute("mode", show);
                document.body.setAttribute("movie", formValues.movie ?? "no");
                if (formValues.movie) {
                    window.cnv.parentNode.focus();
                }
            });

            window.ctrl.addEventListener("dblclick", (evt) => {
                evt.preventDefault();
                evt.stopPropagation();
                ctrl.x = 0;
                ctrl.y = 0;
                evt.currentTarget.removeAttribute("transform");
            });

            const canvas = window.cnv;

            const minSize = Math.min(window.innerWidth, window.innerHeight);
            const expSize = Math.pow(
                2,
                Math.ceil(Math.log(minSize) / Math.log(2)) + 2,
            );

            const images = ["house.svg", "grid.svg"];
            const sheers = [0.1, 0.0];

            const textureImages = await Promise.all(
                images.map((i) => loadImage(i, expSize, expSize)),
            );
            const vertexShader = await fetch("./shader-vertex.glsl").then((r) =>
                r.text(),
            );
            const fragmentShader = await fetch("./shader-fragment.glsl").then(
                (r) => r.text(),
            );
            const regl = createREGL({
                canvas: cnv,
                pixelRatio: window.devicePixelRatio,
                attributes: {
                    antialias: true,
                    depth: false,
                },
            });

            let ti = 0;
            for (let t of images) {
                const o = document.createElement("option");
                o.appendChild(document.createTextNode(t.replace(".svg", "")));
                o.setAttribute("value", ti++);
                window.textureSelect.appendChild(o);
            }
            const textureOptions = {
                mag: "linear",
                flipY: true,
                min: "linear",
                wrap: ["repeat", "repeat"],
            };

            const textures = textureImages.map((textureImage) => {
                return regl.texture({ data: textureImage, ...textureOptions });
            });
            let activeTexture = 0;

            const swirlPlot = regl({
                viewport: {
                    x: () =>
                        ((window.innerWidth -
                            Math.max(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    y: () =>
                        ((window.innerHeight -
                            Math.max(window.innerWidth, window.innerHeight)) /
                            2) *
                        window.devicePixelRatio *
                        2,
                    width: () =>
                        Math.max(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                    height: () =>
                        Math.max(window.innerWidth, window.innerHeight) *
                        window.devicePixelRatio *
                        2,
                },
                frag: fragmentShader,
                vert: vertexShader,

                attributes: {
                    position: [-2, 0, 0, -2, 2, 2],
                },

                uniforms: {
                    texture: regl.prop("texture"),
                    ctrl: regl.prop("ctrl"),
                    offset: regl.prop("offset"),
                    zoom: regl.prop("zoom"),
                    warp: regl.prop("warp"),
                    sheer: regl.prop("sheer"),
                    rotation: regl.prop("rotation"),
                    zoom: regl.prop("zoom"),
                    zoomCyclic: regl.prop("zoomCyclic"),
                    zoomClamped: regl.prop("zoomClamped"),
                    zoomFactor: regl.prop("zoomFactor"),
                    zoomCenter: regl.prop("zoomCenter"),
                    escherAngle: regl.prop("escherAngle"),
                    escherScale: regl.prop("escherScale"),
                    plotPolar: regl.prop("plotPolar"),
                },

                count: 3,
            });

            function rsz() {
                canvas.width = window.innerWidth * window.devicePixelRatio * 2;
                canvas.height =
                    window.innerHeight * window.devicePixelRatio * 2;

                const minSize = Math.min(window.innerWidth, window.innerHeight);
                const expSize = Math.pow(
                    2,
                    Math.ceil(Math.log(minSize) / Math.log(2)) + 2,
                );
                for (let t = 0; t < textures.length; t++) {
                    if (textureImages.width < expSize) {
                        textureImages.width = expSize;
                        textureImages.height = expSize;
                        const oldTexture = textures[t];
                        textures[t] = regl.texture({
                            data: textureImages[t],
                            ...textureOptions,
                        });

                        oldTexture.destroy();
                    }
                }
            }
            rsz();

            window.addEventListener("resize", rsz);

            regl.frame(({ time }) => {
                if (window.movie.checked) {
                    zoom -= 0.01;
                }
                regl.clear({
                    color: [0, 0, 0, 0],
                    depth: 1,
                });

                if (!textures[activeTexture]) {
                    return;
                }

                if (show === "log") {
                    if (window.movie.checked) {
                        ctrl.y = ((ctrl.y + 0.01 + 1) % 2) - 1;
                    }
                    swirlPlot({
                        texture: textures[activeTexture],
                        ctrl: [0, 0],
                        offset: [ctrl.x, ctrl.y],
                        zoom: 0.0,
                        zoomClamped: 0.0,
                        zoomFactor: 16,
                        sheer: sheers[activeTexture] ?? 0,
                        zoomCenter: [0, 0],
                        rotation: rotation,
                        escherAngle: -Math.PI / 2.0,
                        escherScale: Math.pow(2, zoomClamped),
                        warp: 1,
                        plotPolar: 1,
                    });
                } else if (show == "escher") {
                    swirlPlot({
                        texture: textures[activeTexture],
                        ctrl: [0, 0],
                        offset: [ctrl.x, ctrl.y],
                        zoom,
                        zoomClamped,
                        zoomFactor: 16,
                        sheer: sheers[activeTexture] ?? 0,
                        zoomCenter: [0, 0],
                        rotation: rotation,
                        escherAngle: 0.463776890039444,
                        escherScale: 1.117768667936325,
                        warp: 1,
                        plotPolar: 0,
                    });
                } else if (show == "freestyle") {
                    swirlPlot({
                        texture: textures[activeTexture],
                        ctrl: [ctrl.x, ctrl.y],
                        offset: [0, 0],
                        zoom,
                        zoomClamped,
                        zoomFactor: 16,
                        sheer: sheers[activeTexture] ?? 0,
                        zoomCenter: [0, 0],
                        rotation: rotation,
                        escherAngle: 0.0,
                        escherScale: 1.0,
                        warp: 1,
                        plotPolar: 0,
                    });
                } else {
                    swirlPlot({
                        texture: textures[activeTexture],
                        ctrl: [0, 0],
                        offset: [ctrl.x, ctrl.y],
                        zoom,
                        zoomClamped,
                        zoomFactor: 16,
                        sheer: sheers[activeTexture] ?? 0,
                        zoomCenter: [0, 0],
                        rotation: rotation,
                        escherAngle: 0.0,
                        warp: 1,
                        escherScale: 1,
                        plotPolar: 0,
                    });
                }
            });
            window.loader.parentNode.removeChild(window.loader);
        </script>
